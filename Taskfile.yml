version: '3'

vars:
  BUILD_DIR: build
  C_FILES: >-
    core/include/*.h core/src/*.c core/tests/*.c
    bindings/js/wasm/*.c bindings/python/src/eik/_module.c
  CFLAGS: -std=c99 -Wall -Wextra -Wpedantic -Werror -Icore/include
  PY_CORE: bindings/python/src/eik/_core

tasks:
  default:
    silent: true
    cmds:
      - task --list

  # ---------------------------------------------------------------- formatting

  format:
    desc: Format all C sources
    cmds:
      - clang-format -i {{.C_FILES}}

  format:check:
    desc: Fail if any C source is not formatted (CI)
    cmds:
      - clang-format --dry-run --Werror {{.C_FILES}}

  # ---------------------------------------------------------------------- core

  core:test:
    desc: Build and run the core tests under ASan + UBSan
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - >-
        cc {{.CFLAGS}} -g -fsanitize=address,undefined
        core/src/bg_eik.c core/tests/test_bg_eik.c
        -o {{.BUILD_DIR}}/test_core
      - ./{{.BUILD_DIR}}/test_core

  # ------------------------------------------------------------------------ js

  wasm:build:
    desc: Compile the core into a freestanding wasm module
    sources:
      - core/include/*.h
      - core/src/*.c
      - bindings/js/wasm/*.c
    generates:
      - bindings/js/build/bg_eik.wasm
    cmds:
      - mkdir -p bindings/js/build
      - >-
        clang --target=wasm32 -nostdlib -O2 -Icore/include
        -Wl,--no-entry
        core/src/bg_eik.c bindings/js/wasm/shim.c
        -o bindings/js/build/bg_eik.wasm

  js:install:
    dir: bindings/js
    sources:
      - package.json
    cmds:
      - npm install

  js:build:
    desc: Build the npm package (wasm + TypeScript)
    deps: [wasm:build, js:install]
    dir: bindings/js
    cmds:
      - npm run build

  js:test:
    desc: Run the JS tests against the shared test vectors
    deps: [js:build]
    dir: bindings/js
    cmds:
      - npm test

  # -------------------------------------------------------------------- python

  python:sync:
    desc: Copy the C core into the Python package (required for sdist)
    cmds:
      - rm -rf {{.PY_CORE}}
      - mkdir -p {{.PY_CORE}}
      - cp -r core/include core/src {{.PY_CORE}}/

  python:install:
    desc: Editable install with test dependencies (run inside a virtualenv)
    deps: [python:sync]
    dir: bindings/python
    cmds:
      - python -m pip install -e ".[test]"

  python:test:
    desc: Run the Python tests against the shared test vectors
    deps: [python:install]
    dir: bindings/python
    cmds:
      - python -m pytest -q

  python:build:
    desc: Build sdist and wheel
    deps: [python:sync]
    dir: bindings/python
    cmds:
      - python -m build

  # ----------------------------------------------------------------------- all

  test:
    desc: Format check + every test suite
    cmds:
      - task: format:check
      - task: core:test
      - task: js:test
      - task: python:test

  clean:
    desc: Remove all build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}} {{.PY_CORE}}
      - rm -rf bindings/js/build bindings/js/dist bindings/js/src/wasm-bytes.ts
      - rm -rf bindings/python/build bindings/python/dist bindings/python/src/*.egg-info
      - find bindings/python -name "*.so" -delete -o -name "*.pyd" -delete
      - find bindings/python -name __pycache__ -type d -prune -exec rm -rf {} +
